services:
  api-1: &api
    build:
      context: .
      dockerfile: Dockerfile.native
    image: rinha-fraud:v8-native-baseline
    networks:
      - rinha-net
    environment:
      PORT: 9999
      DATA_DIR: /data
      # microhttp connection event-loop threads. One non-blocking loop is ideal
      # on the rinha 0.45 CPU budget; more threads only contend for the core.
      CONCURRENCY: 1
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "165M"

  api-2:
    <<: *api

  lb:
    image: nginx:1.27-alpine
    depends_on:
      - api-1
      - api-2
    networks:
      - rinha-net
    ports:
      - "9999:9999"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: "20M"

networks:
  rinha-net:
    driver: bridge