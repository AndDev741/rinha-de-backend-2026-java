# ─────────────────────────────────────────────────────────────
# rinha-fraud — local stack (v7: int16 IVF + bbox repair, JVM)
#
# Layout:
#   client → nginx (lb) → round-robin → api-1 + api-2
#
# Resource budget (rinha rules: 1 CPU + 350 MB total):
#   nginx  : 0.10 CPU /  20 MB
#   api-1  : 0.45 CPU / 165 MB
#   api-2  : 0.45 CPU / 165 MB
#   ─────────────────────────────
#   TOTAL  : 1.00 CPU / 350 MB
#
# Memory profile per api-* container (JVM):
#   - dataset short[]      : ~84 MB  (int16 IVF, vs v5/v6 42 MB int8)
#   - centroids + bbox     : ~21 KB  (cache-friendly, sits in L1)
#   - JVM overhead         : ~50 MB  (metaspace, code cache, threads)
#   - working heap         : ~20 MB
#   total                  ≈ 155 MB → -Xmx128m heap + ~30 MB non-heap fits 165 MB
# ─────────────────────────────────────────────────────────────

services:
  api-1: &api
    build:
      context: .
      dockerfile: Dockerfile
    image: rinha-fraud:v7
    networks:
      - rinha-net
    volumes:
      - ./data:/data:ro
    environment:
      PORT: 9999
      DATA_DIR: /data
      THREADS: 2
      # v7: int16 dataset is 84 MB heap. -Xmx128m gives ~44 MB of working
      # heap headroom beyond the data, comfortably absorbing GC churn.
      JAVA_OPTS: "-Xmx128m -XX:+UseSerialGC"
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "165M"

  api-2:
    <<: *api

  lb:
    image: nginx:1.27-alpine
    depends_on:
      - api-1
      - api-2
    networks:
      - rinha-net
    ports:
      - "9999:9999"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: "20M"

networks:
  rinha-net:
    driver: bridge
