# ─────────────────────────────────────────────────────────────
# rinha-fraud — submission stack
#
# This compose file is what the rinha test engine runs. It does
# not build anything: it pulls the pre-baked image from Docker
# Hub. The image already contains the int16 IVF dataset under
# /data, so /ready returns 200 within ~1 second after startup.
#
# Full source code, Dockerfile, and journey notes live on the
# `main` branch.
#
# Resource budget (rinha rules: 1 CPU + 350 MB total):
#   nginx  : 0.10 CPU /  20 MB
#   api-1  : 0.45 CPU / 165 MB
#   api-2  : 0.45 CPU / 165 MB
#   ─────────────────────────────
#   TOTAL  : 1.00 CPU / 350 MB
# ─────────────────────────────────────────────────────────────

services:
  api-1: &api
    image: anddev741/rinha-fraud-java:v9-jvm
    networks:
      - rinha-net
    environment:
      PORT: 9999
      DATA_DIR: /data
      # HotSpot JVM build (microhttp). Local: native ~40-80ms vs JVM ~15ms — the
      # native-image -O3 hot loop loses to a warmed C2 JIT. CONCURRENCY=2 overlaps
      # the memory-bound IVF scan (C=2 local sweet spot; C=3 over-threads).
      CONCURRENCY: 2
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "165M"

  api-2:
    <<: *api

  lb:
    image: nginx:1.27-alpine
    depends_on:
      - api-1
      - api-2
    networks:
      - rinha-net
    ports:
      - "9999:9999"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: "20M"

networks:
  rinha-net:
    driver: bridge
