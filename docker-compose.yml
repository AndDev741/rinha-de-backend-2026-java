# ─────────────────────────────────────────────────────────────
# rinha-fraud — local stack (v6: GraalVM native binary)
#
# Layout:
#   client → nginx (lb) → round-robin → api-1 + api-2
#
# Resource budget (rinha rules: 1 CPU + 350 MB total):
#   nginx  : 0.10 CPU /  30 MB
#   api-1  : 0.45 CPU /  85 MB
#   api-2  : 0.45 CPU /  85 MB
#   ─────────────────────────────
#   TOTAL  : 1.00 CPU / 200 MB     ← ~150 MB UNDER the rinha 350 MB ceiling
#
# Memory profile per api-* container (native binary):
#   - dataset byte[]    : ~42 MB  (heap-resident int8 IVF)
#   - centroids + offs  : ~15 KB  (negligible)
#   - native runtime    : ~10-15 MB  (vs ~50-80 MB JVM overhead in v5)
#   - working memory    : ~10 MB
#   - container OS      : ~5 MB
#   total                ≈ 70-75 MB → 85 MB cgroup limit gives headroom
# ─────────────────────────────────────────────────────────────

services:
  api-1: &api
    build:
      context: .
      dockerfile: Dockerfile
    image: rinha-fraud:v6
    networks:
      - rinha-net
    volumes:
      - ./data:/data:ro
    environment:
      PORT: 9999
      DATA_DIR: /data
      THREADS: 2
      # No JAVA_OPTS — there's no JVM. The native binary handles its own
      # GC and memory directly. The size is determined at native-image
      # compile time (--gc=serial in pom.xml).
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "85M"

  api-2:
    <<: *api

  lb:
    image: nginx:1.27-alpine
    depends_on:
      - api-1
      - api-2
    networks:
      - rinha-net
    ports:
      - "9999:9999"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: "30M"

networks:
  rinha-net:
    driver: bridge
