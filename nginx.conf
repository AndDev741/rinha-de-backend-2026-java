# ─────────────────────────────────────────────────────────────
# nginx LB for the rinha-fraud stack
#
# Design notes:
#  - Single worker process. We have 1 vCPU total across the whole stack;
#    multiple workers would only burn cycles in context switching.
#  - Round-robin upstream balancing — exactly what the challenge requires.
#  - Keepalive pool to upstream so we don't pay the TCP handshake per req.
#  - proxy_buffering off — payloads are <1 KB, buffering adds no value.
#  - access_log off — per-request logging only burns the scarce CPU budget.
# ─────────────────────────────────────────────────────────────

worker_processes 1;
error_log /dev/stderr warn;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    access_log off;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    keepalive_timeout 30s;
    keepalive_requests 1000;

    upstream fraud_upstream {
        server api-1:9999;
        server api-2:9999;
        keepalive 64;
    }

    server {
        listen 9999 default_server;

        location = /ready {
            proxy_pass http://fraud_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        location = /fraud-score {
            proxy_pass http://fraud_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_buffering off;
            proxy_request_buffering off;

            proxy_connect_timeout 1s;
            proxy_send_timeout 2s;
            proxy_read_timeout 2s;
        }

        location / {
            return 404;
        }
    }
}
