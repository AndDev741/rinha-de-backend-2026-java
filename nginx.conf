# ─────────────────────────────────────────────────────────────
# nginx LB for the rinha-fraud stack
#
# Design notes:
#  - Single worker process. We have 1 vCPU total across the whole stack;
#    multiple workers would only burn cycles in context switching.
#  - Round-robin upstream balancing — exactly what the challenge requires.
#    No least_conn / hash, just plain rotation.
#  - Keepalive pool to upstream so we don't pay the TCP handshake on every
#    request. With ~900 req/s, that's a meaningful chunk of latency saved.
#  - proxy_buffering off — payloads are <1 KB, buffering adds no value
#    and just touches more memory pages.
# ─────────────────────────────────────────────────────────────

worker_processes 1;
# Keep error log small; we don't want to fill disk under load
error_log /dev/stderr warn;

events {
    worker_connections 4096;
    # epoll is the default on Linux; explicit for clarity
    use epoll;
    multi_accept on;
}

http {
    access_log off;       # we don't care about per-request logs in tests
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # Don't waste cycles waiting for client keep-alive once we're done
    keepalive_timeout 30s;
    keepalive_requests 1000;

    upstream fraud_upstream {
        server api-1:9999;
        server api-2:9999;
        # Pool of persistent connections to upstream — survives across
        # client requests, so backend connections are reused.
        keepalive 64;
    }

    server {
        listen 9999 default_server;

        # Health endpoint exposed at the LB level — nginx itself is "ready"
        # only when the upstream has a healthy server. We just proxy to /ready
        # of any upstream and let it answer.
        location = /ready {
            proxy_pass http://fraud_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        location = /fraud-score {
            proxy_pass http://fraud_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_buffering off;
            proxy_request_buffering off;

            # Match the k6 test timeout (2001 ms). If a single backend takes
            # longer than this, fail fast — don't let the LB queue extend p99.
            proxy_connect_timeout 1s;
            proxy_send_timeout 2s;
            proxy_read_timeout 2s;
        }

        # Anything else: 404
        location / {
            return 404;
        }
    }
}
