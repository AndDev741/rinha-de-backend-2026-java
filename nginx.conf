# ─────────────────────────────────────────────────────────────
# nginx LB for the rinha-fraud stack
#
# Design notes:
#  - Single worker process. We have 1 vCPU total across the whole stack;
#    multiple workers would only burn cycles in context switching.
#  - Round-robin upstream balancing — exactly what the challenge requires.
#  - Keepalive pool to upstream so we don't pay the TCP handshake per req.
#  - proxy_buffering off — payloads are <1 KB, buffering adds no value.
#
# Instrumentation:
#  - access log is ON during measurement runs, with timing fields.
#  - log goes to /tmp/nginx-timing.log inside the container, with a 64k
#    buffer and 1s flush so disk writes don't dominate the path under load.
#  - For production rinha runs, comment out the access_log line.
# ─────────────────────────────────────────────────────────────

worker_processes 1;
error_log /dev/stderr warn;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    # Timing log. Field meaning:
    #   $msec                    epoch seconds with ms resolution
    #   $request_time            total time nginx spent on the request (read body
    #                            + upstream + send response)
    #   $upstream_response_time  time spent in upstream (the api container)
    #   $upstream_connect_time   TCP handshake / keepalive lookup time
    #   $status                  HTTP status code
    log_format timing '$msec $request_time $upstream_response_time '
                      '$upstream_connect_time $status';
    access_log /tmp/nginx-timing.log timing buffer=64k flush=1s;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    keepalive_timeout 30s;
    keepalive_requests 1000;

    upstream fraud_upstream {
        server api-1:9999;
        server api-2:9999;
        keepalive 64;
    }

    server {
        listen 9999 default_server;

        location = /ready {
            proxy_pass http://fraud_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        location = /fraud-score {
            proxy_pass http://fraud_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_buffering off;
            proxy_request_buffering off;

            proxy_connect_timeout 1s;
            proxy_send_timeout 2s;
            proxy_read_timeout 2s;
        }

        # Per-backend stats endpoints (debug only). Bypass round-robin so we
        # can read each container's histograms separately.
        location = /stats/api-1 {
            proxy_pass http://api-1:9999/stats;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
        location = /stats/api-2 {
            proxy_pass http://api-2:9999/stats;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
        location = /stats/reset {
            # POST here resets BOTH backends sequentially via a sub-loop in
            # the load script. nginx alone can't fan-out, so we just route
            # to the first by default; callers should target /stats/api-N
            # /reset explicitly. Kept for convenience: GET returns combined.
            proxy_pass http://fraud_upstream/stats;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
        location = /stats/api-1/reset {
            proxy_pass http://api-1:9999/stats/reset;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
        location = /stats/api-2/reset {
            proxy_pass http://api-2:9999/stats/reset;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        location / {
            return 404;
        }
    }
}
